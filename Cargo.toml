[package]
name = "dist-alloc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Pool the CPUs, memory and GPUs of ordinary networked machines and run jobs across them"
license = "MIT"
repository = "https://github.com/Sovra-AI/sovra-compute-pool"
readme = "README.md"
keywords = ["distributed", "gpu", "scheduler", "cluster", "machine-learning"]
categories = ["command-line-utilities", "concurrency"]
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
nix = { version = "0.32.0", features = ["signal", "fs", "net", "process"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "signal", "sync", "time", "net", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Binary crate: no public API whose docs would need these sections.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Sizes and loads are converted to floating point only to print them.
cast_precision_loss = "allow"
unwrap_used = "warn"
dbg_macro = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dev-dependencies]
serde_json = "1.0.154"
